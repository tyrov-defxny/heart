// Browser version of heart.py (same maths). When the heart is finished, its pieces
// fly off like confetti and gather into the message.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 740, DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
const CX = W / 2 - 170, CY = 350;          // heart on the left, kitten on the right
const RIBBON_PINK = '#f4b6c2';
const u = (a, b) => a + Math.random() * (b - a);
const clamp01 = x => Math.max(0, Math.min(1, x));
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rgb = (r, g, b) => `rgb(${r * 255 | 0},${g * 255 | 0},${b * 255 | 0})`;

function heart(a, scale) {
  const x = 16 * Math.pow(Math.sin(a), 3) * scale;
  const y = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale;
  return [x, y];
}
const strokes = [];                         // remembered so the pieces can become confetti
function stroke(x, y, ang, len, col, wd, jx = 0, jy = 0) {
  const x1 = CX + x + jx, y1 = CY - (y + jy);
  const x2 = CX + x + len * Math.cos(ang), y2 = CY - (y + len * Math.sin(ang));
  ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  strokes.push([(x1 + x2) / 2, (y1 + y2) / 2, col]);
}
function pass1() {
  const a = u(0, 2 * Math.PI), sc = u(0.5, 15.5), [x, y] = heart(a, sc);
  const ang = Math.atan2(y, x) + u(-0.5, 0.5), len = u(5, 14);
  stroke(x, y, ang, len, rgb(1.0, u(0.25, 0.55), u(0.65, 0.85)), u(0.5, 1.2));
}
function pass2() {
  const a = u(0, 2 * Math.PI), [x, y] = heart(a, 16.0);
  const ang = Math.atan2(y, x) + u(-0.35, 0.35), len = u(10, 32);
  stroke(x, y, ang, len, rgb(1.0, u(0.45, 0.75), u(0.75, 0.95)), u(0.4, 0.9), u(-2, 2), u(-2, 2));
}

// ---------- message as target points ----------
const LINES = [['i love you', CY - 5], ['Sabosh', CY + 100]];
const TEXT_FONT = 'italic 700 100px Georgia, "Times New Roman", serif';
function textTargets() {
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  const g = o.getContext('2d'); g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = TEXT_FONT;
  LINES.forEach(([t, y]) => g.fillText(t, CX, y));
  const d = g.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) if (d[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
  return pts;
}
function drawText(alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = RIBBON_PINK; ctx.textAlign = 'center';
  ctx.font = TEXT_FONT; LINES.forEach(([t, y]) => ctx.fillText(t, CX, y)); ctx.restore();
}

// ---------- timeline ----------
const T1 = 11000, T2 = 7000, HOLD = 900;
let i = 0, start = 0, snap, parts, t0;
function loop(now) {
  if (!start) start = now;
  const el = now - start;
  const target = el < T1 ? 10000 * el / T1 : Math.min(13500, 10000 + 3500 * (el - T1) / T2);
  while (i < target) { (i < 10000 ? pass1 : pass2)(); i++; }
  if (i < 13500) return requestAnimationFrame(loop);
  snap = document.createElement('canvas'); snap.width = cv.width; snap.height = cv.height;
  snap.getContext('2d').drawImage(cv, 0, 0);
  const pts = textTargets();
  const pool = strokes.slice().sort(() => Math.random() - .5);
  parts = pts.map((p, k) => {
    const s = pool[k % pool.length], sx = s[0], sy = s[1];
    const mx = (sx + p[0]) / 2, my = (sy + p[1]) / 2, sw = u(-260, 260);
    return { sx, sy, tx: p[0], ty: p[1], cx: mx + sw, cy: my + u(-300, 60), col: s[2],
             delay: u(0, 2200), dur: u(2200, 3400), r: u(1.1, 2.1) };
  });
  t0 = performance.now() + HOLD;
  requestAnimationFrame(fly);
}
function fly(now) {
  const el = Math.max(0, now - t0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // heart dissolves while its pieces leave
  ctx.globalAlpha = 1 - easeIO(clamp01(el / 3600)); ctx.drawImage(snap, 0, 0, W, H); ctx.globalAlpha = 1;
  let landed = 0;
  for (const p of parts) {
    const k = clamp01((el - p.delay) / p.dur), e = easeIO(k), v = 1 - e;
    const x = v * v * p.sx + 2 * v * e * p.cx + e * e * p.tx;
    const y = v * v * p.sy + 2 * v * e * p.cy + e * e * p.ty;
    if (k >= 1) landed++;
    ctx.fillStyle = p.col;
    const sz = p.r * (k > 0 && k < 1 ? 1.5 : 1);
    ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
  }
  const done = el - 4800;                    // once almost everything has landed, sharpen the text
  if (done > 0) drawText(clamp01(done / 1400));
  if (done > 600) {
    const a = clamp01((done - 600) / 1600), kw = 140, kh = kitten.height * kw / kitten.width;
    ctx.globalAlpha = a; ctx.drawImage(kitten, W / 2 + 300 - kw / 2, CY + 60 - kh / 2, kw, kh); ctx.globalAlpha = 1;
  }
  requestAnimationFrame(fly);
}
ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
requestAnimationFrame(loop);
